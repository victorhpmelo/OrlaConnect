name: Orla Conecta – CI/CD

on:
  push:
    branches:
      - main
      - main-dev
      - test
      - main-Victor
      - test-Victor
  pull_request:
    branches:
      - main
      - main-dev
      - test
      - main-Victor
      - test-Victor

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: orla-conecta-backend/orla-conecta-backend.csproj
  SOLUTION_PATH: orla-conecta-backend/orla-conecta-backend.sln

jobs:
  # ─────────────────────────────────────────────
  # Job 1 – Build & test the backend
  # ─────────────────────────────────────────────
  backend-ci:
    name: Backend – Build & Test
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: CiTest@12345
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CiTest@12345' -Q 'SELECT 1' -No"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/orla-conecta-backend.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        working-directory: orla-conecta-backend
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        working-directory: orla-conecta-backend
        run: dotnet build ${{ env.PROJECT_PATH }} --no-restore -c Release

      - name: Run EF migrations (smoke test)
        working-directory: orla-conecta-backend
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=OrlaConectaDb_CI;User Id=sa;Password=CiTest@12345;TrustServerCertificate=True;"
          Jwt__Key: "ci-secret-key-not-used-in-production-min32chars!"
          Jwt__Issuer: "orla-conecta-ci"
          Jwt__Audience: "orla-conecta-ci"
          Smtp__Host: "localhost"
          Smtp__Port: "25"
          Smtp__Username: "ci@orlaconecta.com"
          Smtp__Password: ""
          Smtp__FromEmail: "ci@orlaconecta.com"
          Smtp__FromName: "Orla Conecta CI"
          Smtp__AdminEmail: "ci@orlaconecta.com"
          Authentication__Google__ClientId: ""
          Authentication__Google__ClientSecret: ""
          Stripe__SecretKey: "sk_test_placeholder"
        run: |
          dotnet tool install --global dotnet-ef
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef database update --project ${{ env.PROJECT_PATH }} --no-build

      # Uncomment when a test project is added:
      # - name: Run tests
      #   working-directory: orla-conecta-backend
      #   run: dotnet test ${{ env.SOLUTION_PATH }} --no-build -c Release --verbosity normal

  # ─────────────────────────────────────────────
  # Job 2 – Build the frontend
  # ─────────────────────────────────────────────
  frontend-ci:
    name: Frontend – Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: orla-conecta-front

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: orla-conecta-front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        env:
          VITE_API_URL: http://localhost:5001/api
        run: npm run build

  # ─────────────────────────────────────────────
  # Job 3 – Build & push Docker image (main only)
  # ─────────────────────────────────────────────
  docker-publish:
    name: Docker – Build & Push
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: orla-conecta-backend
          file: orla-conecta-backend/docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/orla-conecta-api:latest
            ${{ secrets.DOCKER_USERNAME }}/orla-conecta-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
